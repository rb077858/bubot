<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הבובות של ציבי</title>
  <meta name="description" content="גלריית בובות סרוגות בעבודת יד">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Suez+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf6ef;
      --card: #ffffff;
      --ink: #3a2e2a;
      --muted: #7a6a62;
      --accent: #c2476b;
      --stage: #f3e7da;
      --line: #eadccd;
      --wa: #25d366;
      --wa-dark: #1da851;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Rubik", system-ui, sans-serif;
      line-height: 1.6;
    }
    header {
      text-align: center;
      padding: 56px 16px 32px;
    }
    h1 {
      font-family: "Suez One", serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 4rem);
      margin: 0;
      color: var(--accent);
      line-height: 1.1;
    }
    .subtitle { font-size: 1.15rem; color: var(--muted); margin: 10px 0 0; }
    .about { max-width: 560px; margin: 18px auto 0; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--wa); color: #fff; text-decoration: none;
      font-weight: 500; font-size: 1rem;
      padding: 12px 22px; border-radius: 999px; border: 0; cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .btn:hover { background: var(--wa-dark); transform: translateY(-1px); }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    header .btn { margin-top: 24px; }

    main { max-width: 1180px; margin: 0 auto; padding: 8px 16px 64px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .stage {
      background: radial-gradient(circle at 50% 60%, #fff 0%, var(--stage) 75%);
      aspect-ratio: 1 / 1;
      display: flex; align-items: center; justify-content: center;
      padding: 20px; cursor: zoom-in; border: 0; width: 100%; min-height: 0; overflow: hidden;
    }
    .stage img {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 10px 12px rgba(80, 50, 30, .22));
      transition: transform .3s;
    }
    .card:hover .stage img { transform: scale(1.04) rotate(-1deg); }
    .info { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .info h2 { margin: 0; font-size: 1.3rem; }
    .info p { margin: 0; color: var(--muted); flex: 1; }

    footer { text-align: center; color: var(--muted); padding: 24px 16px 40px; border-top: 1px solid var(--line); }

    /* תצוגה מוגדלת */
    dialog {
      border: 0; border-radius: 20px; padding: 0; max-width: min(92vw, 720px); width: 100%;
      background: var(--card); color: var(--ink);
    }
    dialog::backdrop { background: rgba(40, 25, 20, .6); }
    dialog .stage { aspect-ratio: auto; height: min(70vh, 640px); cursor: default; }
    dialog .info { padding: 16px 24px 24px; }
    .close {
      position: absolute; top: 10px; left: 10px;
      width: 40px; height: 40px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.9); font-size: 1.4rem; cursor: pointer; color: var(--ink);
    }
  </style>
</head>
<body>
  <header>
    <h1 id="site-title"></h1>
    <p class="subtitle" id="site-subtitle"></p>
    <p class="about" id="site-about"></p>
    <a class="btn" id="contact-main" target="_blank" rel="noopener"></a>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer id="footer"></footer>

  <dialog id="viewer">
    <button class="close" aria-label="סגירה">×</button>
    <div class="stage"><img alt=""></div>
    <div class="info">
      <h2></h2>
      <p></p>
    </div>
  </dialog>

  <!-- כל התוכן (בובות, מספר וואטסאפ, טקסטים) נמצא בקובץ dolls.js -->
  <script src="dolls.js"></script>
  <script>
    const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>';

    const waLink = (text) =>
      `https://wa.me/${SITE.whatsappNumber}?text=${encodeURIComponent(text)}`;
    const setBtn = (el, href, label) => { el.href = href; el.innerHTML = WA_ICON + "<span></span>"; el.lastChild.textContent = label; };

    document.getElementById("site-title").textContent = SITE.title;
    document.getElementById("site-subtitle").textContent = SITE.subtitle;
    document.getElementById("site-about").textContent = SITE.about;
    document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${SITE.title} · כל הבובות בעבודת יד`;
    setBtn(document.getElementById("contact-main"), waLink(SITE.whatsappMessage), "צור קשר בוואטסאפ");

    const viewer = document.getElementById("viewer");
    const grid = document.getElementById("grid");

    function openViewer(doll) {
      const img = viewer.querySelector("img");
      img.src = doll.image; img.alt = doll.name;
      viewer.querySelector("h2").textContent = doll.name;
      viewer.querySelector("p").textContent = doll.description;
      viewer.showModal();
    }
    viewer.querySelector(".close").onclick = () => viewer.close();
    viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });

    for (const doll of DOLLS) {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <button class="stage" aria-label="הגדלה"><img loading="lazy"></button>
        <div class="info"><h2></h2><p></p></div>`;
      const img = card.querySelector("img");
      img.src = doll.image; img.alt = doll.name;
      card.querySelector("h2").textContent = doll.name;
      card.querySelector("p").textContent = doll.description;
      card.querySelector(".stage").onclick = () => openViewer(doll);
      grid.appendChild(card);
    }
  </script>
</body>
</html>
